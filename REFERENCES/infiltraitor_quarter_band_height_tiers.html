<h2 class="sr-only">Mockup do sistema de facetas com 4 sub-alturas por andar: escada de tiers de cover (0, 1/4, 2/4, 3/4, 4/4), pilha de quatro blocos cheios formando exatamente quatro andares sem vão, e uma parede com o topo ocluso mantendo a banda de baixo iluminada. Arraste a luz para reacender as faces.</h2>
<style>
  .stage-wrap{background:#15171f;border-radius:var(--border-radius-lg);padding:10px;overflow:hidden}
  .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
  .ctrl .grp{display:flex;gap:4px;align-items:center;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:4px}
  .ctrl button{font-size:13px;padding:5px 10px}
  .ctrl button.on{border-color:var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info)}
  .lab{font-size:12px;color:var(--color-text-secondary);margin-right:2px}
  canvas{display:block;width:100%;height:auto;border-radius:var(--border-radius-md);cursor:grab}
  canvas.drag{cursor:grabbing}
</style>

<div class="ctrl">
  <div class="grp"><span class="lab">Luz</span>
    <button id="l-on" class="on">Acesa</button>
    <button id="l-flick">Piscando</button>
    <button id="l-off">Quebrada</button>
  </div>
  <div class="grp">
    <button id="t-occ" class="on">Cortar topo (oclusão)</button>
    <button id="t-band" class="on">Mostrar bandas 1/4</button>
  </div>
</div>

<div class="stage-wrap"><canvas id="cv" width="1420" height="900"></canvas></div>

<script>
(function(){
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  const DPR=2;const W=cv.width/DPR,H=cv.height/DPR;ctx.scale(DPR,DPR);
  const TW=80,TH=40,STEP=56,Q=STEP/4;
  const ORX=W*0.40,ORY=150,COLS=8,ROWS=5;
  const st={light:'on',occ:true,bands:true};
  const lamp={gx:5.2,gy:0.3,radius:9,energy:1};

  const FLOOR='#c9c3b4',FLOOR_LINE='#b3ad9e';
  const CRATE='#d98a3d',CRATE_E='#a8651f';
  const WALL='#d27e2a',WALL_E='#9c5a18';
  const LT=[255,233,168],ST=[26,30,52];
  const AMB=0.30,DIF=0.20,GAIN=0.70,TOPG=0.80;

  function iso(gx,gy,z){return {x:ORX+(gx-gy)*TW/2,y:ORY+(gx+gy)*TH/2-z*STEP};}
  function cl(v,a,b){return v<a?a:v>b?b:v;}
  function mix(a,b,t){return a+(b-a)*t;}
  function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function rgb(r,g,b){return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
  function shade(base,b){const r=base[0],g=base[1],bl=base[2];
    if(b<0.5){const t=(0.5-b)*2*0.85;return rgb(mix(r,ST[0],t),mix(g,ST[1],t),mix(bl,ST[2],t));}
    const t=(b-0.5)*2*0.6;return rgb(mix(r,LT[0],t),mix(g,LT[1],t),mix(bl,LT[2],t));}
  function en(){return st.light==='off'?0:lamp.energy;}
  function faceB(gx,gy,nx,ny){
    const e=en();if(e<=0)return AMB*0.7;
    const dx=lamp.gx-gx,dy=lamp.gy-gy,d=Math.hypot(dx,dy)||1e-3;
    const at=Math.max(0,1-d/lamp.radius);
    if(nx===0&&ny===0)return cl(AMB+TOPG*at*e,0,1);
    const f=Math.max(0,(dx/d)*nx+(dy/d)*ny);
    return cl(AMB+(DIF+f*GAIN)*at*e,0,1);}

  function poly(p,fill,stroke,w){ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);
    for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.lineWidth=w||1;ctx.strokeStyle=stroke;ctx.stroke();}}
  function diamond(gx,gy,z){const c=iso(gx,gy,z);return [
    {x:c.x,y:c.y-TH/2},{x:c.x+TW/2,y:c.y},{x:c.x,y:c.y+TH/2},{x:c.x-TW/2,y:c.y}];}

  function drawFloor(){for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)poly(diamond(x,y,0),FLOOR,FLOOR_LINE,1);}

  function castShadow(gx,gy,hFloors){
    const dx=gx-lamp.gx,dy=gy-lamp.gy,d=Math.hypot(dx,dy)||1e-3,dir=[dx/d,dy/d];
    const lf=(st.light==='off')?0:1,len=Math.round(hFloors*1.3*(1+d*0.04))*lf;
    for(let i=1;i<=len;i++){const cx=gx+Math.round(dir[0]*i),cy=gy+Math.round(dir[1]*i);
      if(cx<0||cy<0||cx>=COLS||cy>=ROWS)break;
      const a=cl(0.40*(1-(i-1)/(len+1)),0.07,0.40);
      ctx.save();ctx.globalAlpha=a;poly(diamond(cx,cy,0),'#1a1d2e',null);ctx.restore();}}

  // desenha uma face vertical fatiada em bandas de 1/4; cutTop = quartos cortados no topo
  function banded(gx,gy,baseFloor,quarters,base,edge,cutTop){
    const rgbBase=hx(base);
    const vis=Math.max(0,quarters-(cutTop||0));
    castShadow(gx,gy,quarters/4);
    const bl=faceB(gx,gy,0,1),br=faceB(gx,gy,1,0);
    for(let b=0;b<vis;b++){
      const f0=baseFloor+b/4,f1=baseFloor+(b+1)/4,dy=(f1-f0)*STEP;
      const top=diamond(gx,gy,f1),tl=top[3],bm=top[2],tr=top[1];
      poly([tl,bm,{x:bm.x,y:bm.y+dy},{x:tl.x,y:tl.y+dy}],shade(rgbBase,bl),edge,1);
      poly([bm,tr,{x:tr.x,y:tr.y+dy},{x:bm.x,y:bm.y+dy}],shade(rgbBase,br),edge,1);
      if(st.bands){ctx.save();ctx.globalAlpha=0.35;ctx.strokeStyle='#00000055';
        ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(bm.x,bm.y);ctx.lineTo(tr.x,tr.y);ctx.stroke();ctx.restore();}
    }
    // ghost das bandas cortadas (oclusão): contorno tracejado fino
    if(cutTop>0){ctx.save();ctx.setLineDash([4,4]);ctx.globalAlpha=0.35;ctx.strokeStyle='#9aa3b8';
      for(let b=vis;b<quarters;b++){const f0=baseFloor+b/4,f1=baseFloor+(b+1)/4,dy=(f1-f0)*STEP;
        const top=diamond(gx,gy,f1),tl=top[3],bm=top[2],tr=top[1];
        poly([tl,bm,{x:bm.x,y:bm.y+dy},{x:tl.x,y:tl.y+dy}],null,'#9aa3b8',1);
        poly([bm,tr,{x:tr.x,y:tr.y+dy},{x:bm.x,y:bm.y+dy}],null,'#9aa3b8',1);}
      ctx.restore();}
    // topo
    const tf=baseFloor+vis/4,tb=faceB(gx,gy,0,0),topD=diamond(gx,gy,tf);
    poly(topD,shade(rgbBase,tb),edge,1);
    if(tb>0.80&&st.light!=='off'){ctx.save();ctx.globalAlpha=(tb-0.80)*1.8;poly(topD,'rgba(255,238,180,1)',null);ctx.restore();}
  }

  function label(gx,gy,txt){const c=iso(gx,gy,0);ctx.fillStyle='#cdd2dd';ctx.font='12px sans-serif';
    ctx.textAlign='center';ctx.fillText(txt,c.x,c.y+TH/2+16);}

  function render(){
    ctx.clearRect(0,0,W,H);
    drawFloor();
    // escada de tiers (gy=3): 0,1/4,2/4,3/4,4/4
    const ladder=[
      {gx:0,q:0,t:'0 · chão'},{gx:1,q:1,t:'1/4 · rastejar'},{gx:2,q:2,t:'2/4 · agachar'},
      {gx:3,q:3,t:'3/4 · em pé'},{gx:4,q:4,t:'4/4 · bloco'}];
    // pilha de 4 blocos cheios = 4 andares cravados (gx=6,gy=2)
    const items=[];
    for(const it of ladder)items.push({gx:it.gx,gy:3,q:it.q,lab:it.t});
    items.push({gx:6,gy:2,stack:4});
    items.push({gx:0,gy:0,q:4,wall:true,lab:'parede · topo ocluso'});
    items.push({gx:1,gy:0,q:4,wall:true});
    items.sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy));
    for(const it of items){
      if(it.stack){for(let i=0;i<it.stack;i++)banded(it.gx,it.gy,i,4,CRATE,CRATE_E,0);
        label(it.gx,it.gy,'4 blocos = 4 andares');}
      else if(it.wall){const cut=st.occ?3:0;banded(it.gx,it.gy,0,4,WALL,WALL_E,cut);if(it.lab)label(it.gx,it.gy,it.lab);}
      else{if(it.q>0)banded(it.gx,it.gy,0,it.q,CRATE,CRATE_E,0);label(it.gx,it.gy,it.lab);}
    }
    // lâmpada
    const lc=iso(lamp.gx,lamp.gy,3.0),on=st.light!=='off';
    if(on){ctx.save();ctx.globalAlpha=0.5*lamp.energy;ctx.fillStyle='rgba(255,226,140,1)';
      ctx.beginPath();ctx.arc(lc.x,lc.y,28,0,7);ctx.fill();ctx.restore();}
    ctx.beginPath();ctx.moveTo(lc.x,lc.y-32);ctx.lineTo(lc.x,lc.y-8);ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(lc.x,lc.y,8,0,7);ctx.fillStyle=on?(lamp.energy>0.5?'#ffe14d':'#7a6a20'):'#3a3a3a';ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.stroke();
  }

  let drag=false;
  function evt(e){const r=cv.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
    const t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)*sx,y:(t.clientY-r.top)*sy};}
  function toGrid(px,py){const x=px-ORX,y=py-ORY+3.0*STEP;
    return {gx:cl((x/(TW/2)+y/(TH/2))/2,-1,COLS),gy:cl((y/(TH/2)-x/(TW/2))/2,-1,ROWS)};}
  function dn(e){drag=true;cv.classList.add('drag');mv(e);}
  function mv(e){if(!drag)return;const p=evt(e),g=toGrid(p.x,p.y);lamp.gx=g.gx;lamp.gy=g.gy;render();if(e.preventDefault)e.preventDefault();}
  function up(){drag=false;cv.classList.remove('drag');}
  cv.addEventListener('mousedown',dn);window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',dn,{passive:false});cv.addEventListener('touchmove',mv,{passive:false});window.addEventListener('touchend',up);

  function bind(id,fn,grp){document.getElementById(id).addEventListener('click',function(){
    if(grp){grp.forEach(g=>document.getElementById(g).classList.remove('on'));this.classList.add('on');}
    else this.classList.toggle('on');fn(this);render();});}
  bind('l-on',()=>{st.light='on';lamp.energy=1;},['l-on','l-flick','l-off']);
  bind('l-flick',()=>st.light='flick',['l-on','l-flick','l-off']);
  bind('l-off',()=>st.light='off',['l-on','l-flick','l-off']);
  bind('t-occ',(el)=>st.occ=el.classList.contains('on'));
  bind('t-band',(el)=>st.bands=el.classList.contains('on'));
  setInterval(()=>{if(st.light==='flick'){lamp.energy=lamp.energy>0.5?0.18:1;render();}},420);
  render();
})();
</script>
